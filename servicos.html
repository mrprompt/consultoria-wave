---
layout: page
title: Serviços
active: servicos
---
<div class="row">
  {% for servico in site.data.servicos %}
    <div class="col-lg-4 col-md-4 col-sm-4 bottom-pad">
      <div class="content-box ch-item">
        <div class="ch-info-wrap">
          <div class="ch-info">
            <div class="ch-info-front ch-img-1">
              <i class="fa fa-{{ servico.icone }}"></i>
            </div>
            <div class="ch-info-back">
              <i class="fa fa-{{ servico.icone }}"></i>
            </div>
          </div>
        </div>
        <div class="content-box-info">
          <h3>{{ servico.titulo }} </h3>
          <p>{{ servico.descricao }}</p>
          <p><a href="{{ site.baseurl }}/servicos/{{ servico.slug }}">Saiba mais</a></p>
        </div>
      </div>
    </div>
  {% endfor %}  
</div>
