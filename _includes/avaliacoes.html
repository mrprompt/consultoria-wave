<div class="testimonials widget">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="testimonials-title">
            <h3 class="title">Avaliações</h3>
        </div>
    </div>
    <div class="clearfix"></div>
    <div id="testimonials-carousel" class="testimonials-carousel carousel slide animate_afr d5">
        <div class="carousel-inner">
            {% for avaliacao in site.data.avaliacoes %}
            <div class="item {% if forloop.first %} active {% endif %}">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div class="testimonial item">
                    <p>
                        {{ avaliacao.avaliacao }}
                    </p>
                    <div class="testimonials-arrow">
                    </div>
                    <div class="author">
                        <div class="testimonial-image ">
                            <img alt="" src="{{ avaliacao.imagem }}">
                        </div>
                        <div class="testimonial-author-info">
                            <a href="{{ avaliacao.link }}"><span class="color">{{ avaliacao.nome }}</span></a>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
